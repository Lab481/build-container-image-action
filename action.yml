name: 'build-container-image-action'
description: 'The official Lab481 container building action'

inputs:
  registry_name:
    description: registry name (default ghcr.io)
    required: false
    default: "ghcr.io"
  registry_username:
    description: registry username
    required: true
  registry_password:
    description: registry password
    required: true
  image_repository:
    description: container image repository
    required: true
  dockerfile_path:
    description: path to Dockerfile (default ./Dockerfile)
    default: "./Dockerfile"
    required: false
  build_args:
    description: build args to be supplied to the build. Specify as list of newline delimited KEY=VALUE tuples
    default: ""
    required: false
  build_context:
    description: path to build context (default .)
    default: "."
    required: false
  build_target:
    description: sets the target stage to build
    default: ""
    required: false
  push_to_registry:
    description: push to container registry (true/false)
    required: true
  buildx_version:
    description: Buildx version to install, independent of the runner's preinstalled one (default v0.38.1)
    default: "v0.38.1"
    required: false
  use_build_cache:
    description: >-
      Read and write the BuildKit layer cache in the GitHub Actions cache (true/false, default true). Set to false when
      uploading the cache takes longer than rebuilding the layers, e.g. on self-hosted runners with a slow uplink.
    default: "true"
    required: false
  buildx_driver:
    description: >-
      Buildx driver (default docker-container). Use "docker" on persistent self-hosted runners: builds then use the
      runner's Docker daemon and reuse its local layer cache across steps and jobs, e.g. an image already built and
      tested earlier in the job. The GitHub Actions cache is not available with this driver; set use_build_cache to false.
    default: "docker-container"
    required: false
  skip_login:
    description: Skip Docker registry login
    default: "false"
    required: false


runs:
  using: "composite"
  steps:
    - name: Set up Docker Buildx
      id: buildx
      uses: docker/setup-buildx-action@v4
      with:
        version: ${{ inputs.buildx_version }}
        driver: ${{ inputs.buildx_driver }}

    - name: Log into container registry
      uses: docker/login-action@v4
      if: inputs.skip_login != 'true'
      with:
        registry: ${{ inputs.registry_name }}
        username: ${{ inputs.registry_username }}
        password: ${{ inputs.registry_password }}

    - name: Extract container metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ inputs.registry_name }}/${{ inputs.image_repository }}
        tags: |
          # set latest tag for default branch
          type=raw,value=latest,enable={{is_default_branch}}
          # example: main-5840c85-1668618206
          type=raw,value={{branch}}-{{sha}}-{{date 'X'}},enable={{is_default_branch}}
          # git tags
          type=ref,event=tag
          # pr-<pr-number>
          type=ref,event=pr

    - name: Build and push container image
      uses: docker/build-push-action@v7
      with:
        builder: ${{ steps.buildx.outputs.name }}
        context: ${{ inputs.build_context }}
        push: ${{ inputs.push_to_registry }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        file: ${{ inputs.dockerfile_path }}
        target: ${{ inputs.build_target }}
        build-args: ${{ inputs.build_args }}
        cache-from: ${{ inputs.use_build_cache == 'true' && 'type=gha' || '' }}
        cache-to: ${{ inputs.use_build_cache == 'true' && 'type=gha,mode=max' || '' }}
